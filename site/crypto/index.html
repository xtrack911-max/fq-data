<!doctype html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Crypto Lab</title>
<script src="https://unpkg.com/lightweight-charts@4.1.3/dist/lightweight-charts.standalone.production.js"></script>
<script src="gate.js"></script>
<style>
:root{--bg:#f6f7f9;--fg:#15181d;--card:#fff;--line:#dfe3e8;--bad:#b3261e;--ok:#1b7a43;color-scheme:light dark}
@media (prefers-color-scheme:dark){:root{--bg:#0f1115;--fg:#e6e9ee;--card:#171a21;--line:#272c36;--bad:#e5584f;--ok:#3bb273}}
body{margin:0;padding:12px;background:var(--bg);color:var(--fg);font:15px/1.4 system-ui,sans-serif;max-width:900px;margin:auto}
a{color:inherit}h1{font-size:20px;margin:4px 0 10px}
#b{padding:10px;border-radius:8px;font-weight:700;text-align:center;color:#fff;background:var(--bad)}
#b.ok{background:var(--ok)}#r,#age,.hint{font-size:12px;opacity:.75;margin:6px 0}
.row{display:flex;gap:8px;margin:10px 0}
select{flex:1;padding:8px;border-radius:6px;border:1px solid var(--line);background:var(--card);color:var(--fg)}
#c{height:380px;border:1px solid var(--line);border-radius:8px;overflow:hidden;background:var(--card)}
.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:10px}
.k{background:var(--card);border:1px solid var(--line);border-radius:8px;padding:8px}
.k b{display:block;font-size:16px}.k span{font-size:11px;opacity:.7}
</style></head><body>
<a href="../">&larr; Hub</a><h1>Crypto Lab</h1>
<div id="b">SIGNALS SUSPENDED</div><div id="r">checking…</div><div id="age"></div>
<div class="row"><select id="s"></select><select id="i"></select></div>
<div id="c"></div>
<div class="grid">
<div class="k"><span>Mark price</span><b id="m">-</b><span>fair price, used for liquidation</span></div>
<div class="k"><span>Funding</span><b id="f">-</b><span>positive: longs pay shorts</span></div>
<div class="k"><span>Open interest</span><b id="o">-</b><span>total open bets (USD)</span></div>
</div>
<p class="hint" id="n"></p>
<script>
const $=id=>document.getElementById(id);
let cfg=null,chart=null,ser=null;const cache={};
const get=async u=>{const r=await fetch(u+"?t="+Date.now(),{cache:"no-store"});if(!r.ok)throw new Error(r.status);return r.json()};
const ago=ms=>{const m=Math.round((Date.now()-ms)/6e4);return m<90?m+" min":m<2880?Math.round(m/60)+" h":Math.round(m/1440)+" days"};
async function gateCheck(){
  const b=$("b");
  try{
    cfg=await get("data/config.json");const st=await get("data/status.json");
    const g=evaluateGate(st,cfg,Date.now());
    b.className=g.signals_allowed?"ok":"";
    b.textContent=g.signals_allowed?(cfg.live?"LIVE DATA OK":"DATA OK · DELAYED (research mode)"):"SIGNALS SUSPENDED";
    $("r").textContent=g.signals_allowed?(cfg.live?"all freshness checks passed":"live signals are off; data can be a few days old"):g.reasons.join(" · ");
    const t=Object.entries(st.series).filter(([k])=>k.startsWith("klines_1m")).map(([,v])=>v.last_close);
    $("age").textContent=t.length?"Latest candle: "+new Date(Math.min(...t)).toISOString().slice(0,16).replace("T"," ")+" UTC ("+ago(Math.min(...t))+" ago)":"";
  }catch(e){b.className="";b.textContent="SIGNALS SUSPENDED";$("r").textContent="status unreachable";$("age").textContent=""}
}
async function draw(){
  const s=$("s").value,i=$("i").value;
  try{
    cache[s]=cache[s]||await get("data/chart_"+s+".json");const d=cache[s];
    ser.setData(d.tf[i].map(x=>({time:x[0]/1000,open:x[1],high:x[2],low:x[3],close:x[4]})));
    chart.timeScale().fitContent();
    $("m").textContent=d.mark_last?d.mark_last.toLocaleString():"-";
    const f=d.funding.length?d.funding[d.funding.length-1][1]:null;$("f").textContent=f===null?"-":(f*100).toFixed(4)+"%";
    const o=d.oi.length?d.oi[d.oi.length-1][1]:null;$("o").textContent=o===null?"-":(o/1e9).toFixed(2)+" B";
    $("n").textContent="Stored closed candles only. This page shows data; it never places trades.";
  }catch(e){ser.setData([]);$("n").textContent="Chart data unavailable."}
}
["BTCUSDT","ETHUSDT"].forEach(x=>$("s").add(new Option(x)));
["1m","5m","15m","1h","4h","1d"].forEach(x=>$("i").add(new Option(x)));$("i").value="1h";
chart=LightweightCharts.createChart($("c"),{autoSize:true,layout:{background:{color:"transparent"},textColor:getComputedStyle(document.body).color},timeScale:{timeVisible:true}});
ser=chart.addCandlestickSeries();
$("s").onchange=$("i").onchange=draw;draw();gateCheck();setInterval(gateCheck,60000);
</script></body></html>
